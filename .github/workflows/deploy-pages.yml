# Deploy do build estático no GitHub Pages (site de organização:
# https://dgp-comando.github.io). O app é 100% client-side — as camadas
# DataGeo leem o Supabase direto do browser (anon key), então o Pages basta.
# Camadas GEV dependentes de proxy do dev-server degradam graceful
# (decisão registrada em PLANO_FUSAO.md, Fase 2).
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # engines do package.json: >=24.14 <25 || >=26 <27
          node-version: '26'
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
