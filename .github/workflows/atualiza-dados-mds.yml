# Atualiza toda segunda os equipamentos do MDS (CRAS, CREAS, segurança
# alimentar) da API aberta do Mapa Social. Só faz commit se os pontos
# mudaram (o script é idempotente) e então dispara o deploy: push feito com
# GITHUB_TOKEN não aciona o `on: push` de deploy-pages.yml.
name: Atualiza dados MDS

on:
  schedule:
    - cron: '0 9 * * 1' # segunda, 06h de Brasília
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: atualiza-dados-mds
  cancel-in-progress: false

jobs:
  equipamentos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python scripts/build_equipamentos_suas.py
        env:
          PYTHONUTF8: '1'

      - name: Commit se mudou e dispara deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- public/data/equipamentos-suas-pr.geojson; then
            echo "Sem mudança nos equipamentos."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/equipamentos-suas-pr.geojson
          git commit -m 'chore: atualiza equipamentos do MDS (Mapa Social)'
          git push
          gh workflow run deploy-pages.yml --ref main
