# Atualiza toda segunda os dados abertos do MDS: equipamentos (CRAS, CREAS,
# segurança alimentar, API do Mapa Social) e indicadores municipais da ficha
# (CadÚnico, Bolsa Família, Fomento, PAA, API do MI Social). Só faz commit se
# algo mudou (os scripts são idempotentes) e então dispara o deploy: push feito com
# GITHUB_TOKEN não aciona o `on: push` de deploy-pages.yml.
name: Atualiza dados MDS

on:
  schedule:
    - cron: '0 9 * * 1' # segunda, 06h de Brasília
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: atualiza-dados-mds
  cancel-in-progress: false

jobs:
  equipamentos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python scripts/build_equipamentos_suas.py
        env:
          PYTHONUTF8: '1'

      - run: python scripts/build_protecao_social.py
        env:
          PYTHONUTF8: '1'

      - name: Commit se mudou e dispara deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARQS='public/data/equipamentos-suas-pr.geojson public/data/protecao-social-pr.json'
          if git diff --quiet -- $ARQS; then
            echo "Sem mudança nos dados do MDS."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $ARQS
          git commit -m 'chore: atualiza dados abertos do MDS'
          git push
          gh workflow run deploy-pages.yml --ref main
